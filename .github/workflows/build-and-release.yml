name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.2.0)'
        required: true
        default: '1.2.3'

env:
  PYTHON_VERSION: '3.11'
  PROJECT_NAME: 'telegram-multi-account-sender'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build Windows executable
      continue-on-error: true
      run: |
        pyinstaller --onefile --noconsole --name telegram-multi-account-sender --icon=assets/icons/favicon.ico main.py
    
    - name: Upload Windows artifacts
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: |
          dist/telegram-multi-account-sender.exe
        retention-days: 30
        if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pyqt5 libxcb-xinerama0 libxcb-cursor0 || true
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build Linux executable
      continue-on-error: true
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        pyinstaller --onefile --name telegram-multi-account-sender main.py
    
    - name: Create .tar.gz
      if: success()
      run: |
        tar -czf telegram-multi-account-sender-${{ github.ref_name || inputs.version }}-linux.tar.gz dist/telegram-multi-account-sender || true
    
    - name: Upload Linux artifacts
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: linux-build
        path: |
          dist/telegram-multi-account-sender
          telegram-multi-account-sender-*.tar.gz
        retention-days: 30
        if-no-files-found: warn

  build-macos:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build macOS application
      continue-on-error: true
      run: |
        pyinstaller --onefile --name telegram-multi-account-sender main.py
    
    - name: Create .dmg
      if: success()
      run: |
        hdiutil create -srcfolder dist/telegram-multi-account-sender.app -volname "Telegram Multi-Account Message Sender" -fs HFS+ -format UDZO telegram-multi-account-sender-${{ github.ref_name || inputs.version }}-macOS.dmg || true
    
    - name: Upload macOS artifacts
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: macos-build
        path: |
          dist/telegram-multi-account-sender
          telegram-multi-account-sender-*.dmg
        retention-days: 30
        if-no-files-found: warn

  build-pypi:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: |
        python -m build
    
    - name: Check package
      run: |
        twine check dist/*
    
    - name: Upload PyPI package
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/* || echo "PyPI upload skipped (no token or already exists)"

  create-release:
    needs: [build-windows, build-linux, build-macos, build-pypi]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: |
          ## 🎉 Release ${{ github.ref_name }}
          
          ### 📦 Downloads
          
          **Windows:**
          - `telegram-multi-account-sender.exe` - Standalone executable
          
          **Linux:**
          - `telegram-multi-account-sender` - Standalone executable
          - `telegram-multi-account-sender-${{ github.ref_name }}-linux.tar.gz` - Source distribution
          
          **macOS:**
          - `telegram-multi-account-sender` - Standalone executable
          - `telegram-multi-account-sender-${{ github.ref_name }}-macOS.dmg` - Disk image installer
          
          ### 🚀 Installation
          
          **From PyPI:**
          ```bash
          pip install telegram-multi-account-sender
          ```
          
          **From Source:**
          ```bash
          git clone https://github.com/VoxHash/Telegram-Multi-Account-Message-Sender.git
          cd Telegram-Multi-Account-Message-Sender
          pip install -r requirements.txt
          python main.py
          ```
          
          ### 📋 What's New
          
          See [CHANGELOG.md](CHANGELOG.md) for detailed changes.
          
          ### 🆘 Support
          
          - [Documentation](https://github.com/VoxHash/Telegram-Multi-Account-Message-Sender/wiki)
          - [Issues](https://github.com/VoxHash/Telegram-Multi-Account-Message-Sender/issues)
          - [Discussions](https://github.com/VoxHash/Telegram-Multi-Account-Message-Sender/discussions)
        files: |
          windows-build/*
          linux-build/*
          macos-build/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
