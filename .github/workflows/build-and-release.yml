name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.2.0)'
        required: true
        default: '1.2.3'

env:
  PYTHON_VERSION: '3.11'
  PROJECT_NAME: 'telegram-multi-account-sender'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build Windows executable
      run: |
        # Use spec file for more reliable builds
        pyinstaller main.spec || pyinstaller --onefile --noconsole --name telegram-multi-account-sender --icon=assets/icons/favicon.ico --additional-hooks-dir=hooks --hidden-import=PyQt5 --hidden-import=PyQt5.QtCore --hidden-import=PyQt5.QtGui --hidden-import=PyQt5.QtWidgets --hidden-import=telethon --hidden-import=sqlmodel --hidden-import=pydantic --hidden-import=app.gui.widgets.telegram_selector main.py
        test -f dist/telegram-multi-account-sender.exe

    - name: Set version for Windows build
      id: set_version_windows
      shell: bash
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^v ]]; then
            VERSION="v$VERSION"
          fi
        else
          VERSION="${{ github.ref_name }}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Normalize Windows asset name
      shell: bash
      run: |
        if [ -f "dist/telegram-multi-account-sender.exe" ]; then
          cp "dist/telegram-multi-account-sender.exe" "telegram-multi-account-sender-${{ steps.set_version_windows.outputs.version }}-windows.exe"
        fi

    - name: Assemble Windows distribution (EXE + install.ps1 file association)
      shell: bash
      run: |
        VERSION="${{ steps.set_version_windows.outputs.version }}"
        chmod +x packaging/windows/assemble-dist.sh
        packaging/windows/assemble-dist.sh \
          dist/telegram-multi-account-sender.exe \
          "telegram-multi-account-sender-${VERSION}-windows" \
          "${VERSION}"
        # Prefer zip if present; fall back to PowerShell Compress-Archive on windows-latest.
        if command -v zip >/dev/null 2>&1; then
          zip -r "telegram-multi-account-sender-${VERSION}-windows.zip" \
            "telegram-multi-account-sender-${VERSION}-windows"
        else
          powershell.exe -NoProfile -Command \
            "Compress-Archive -Path 'telegram-multi-account-sender-${VERSION}-windows' -DestinationPath 'telegram-multi-account-sender-${VERSION}-windows.zip' -Force"
        fi
    
    - name: Upload Windows artifacts
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: |
          telegram-multi-account-sender-*-windows.exe
          telegram-multi-account-sender-*-windows.zip
        retention-days: 30
        if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pyqt5 libxcb-xinerama0 libxcb-cursor0 libxcb-render0 libxcb-render-util0 libxcb-shape0 libxcb-randr0 libxcb-image0 libxcb-keysyms1 libxcb-icccm4 libxcb-xfixes0 libxcb-sync1 libxcb-xkb1 libxkbcommon0 libxkbcommon-x11-0 || true
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build Linux executable
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        # One-file Linux build; console=True helps CI/headless diagnosis
        sed -i 's/console=False/console=True/' main.spec || true
        pyinstaller main.spec
        test -f dist/telegram-multi-account-sender
    
    - name: Set version for Linux build
      id: set_version_linux
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^v ]]; then
            VERSION="v$VERSION"
          fi
        else
          VERSION="${{ github.ref_name }}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    
    - name: Assemble Linux distribution (desktop + MIME + install.sh)
      run: |
        VERSION="${{ steps.set_version_linux.outputs.version }}"
        DIST_DIR="telegram-multi-account-sender-${VERSION}-linux"
        chmod +x packaging/linux/assemble-dist.sh packaging/linux/install.sh
        ./packaging/linux/assemble-dist.sh dist/telegram-multi-account-sender "${DIST_DIR}" "${VERSION}"
        tar -czf "${DIST_DIR}.tar.gz" "${DIST_DIR}"
        test -f "${DIST_DIR}.tar.gz"
    
    - name: Upload Linux artifacts
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: linux-build
        path: |
          telegram-multi-account-sender-*-linux.tar.gz
        retention-days: 30
        if-no-files-found: warn

  build-macos:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build macOS icns (iconutil)
      run: |
        chmod +x packaging/macos/build-icns.sh packaging/macos/assemble-app.sh
        ./packaging/macos/build-icns.sh

    - name: Build macOS application
      run: |
        pyinstaller main.spec
        test -d "dist/Telegram Multi-Account Message Sender.app" \
          || test -d dist/telegram-multi-account-sender.app \
          || test -f dist/telegram-multi-account-sender
    
    - name: Set version for macOS build
      id: set_version_macos
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^v ]]; then
            VERSION="v$VERSION"
          fi
        else
          VERSION="${{ github.ref_name }}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "version_number=${VERSION#v}" >> $GITHUB_OUTPUT
    
    - name: Assemble .app with Info.plist document types
      run: |
        VERSION="${{ steps.set_version_macos.outputs.version_number }}"
        OUT_APP="dist/Telegram-Multi-Account-Sender.app"
        if [ -d "dist/Telegram Multi-Account Message Sender.app" ]; then
          SRC="dist/Telegram Multi-Account Message Sender.app"
        elif [ -d "dist/telegram-multi-account-sender.app" ]; then
          SRC="dist/telegram-multi-account-sender.app"
        else
          SRC="dist/telegram-multi-account-sender"
        fi
        ./packaging/macos/assemble-app.sh "${SRC}" "${OUT_APP}" "${VERSION}"
        test -f "${OUT_APP}/Contents/Info.plist"

    # Optional: Developer ID sign + Apple notarization.
    # Skips cleanly when secrets are absent (unsigned DMG still published).
    # Never commit .p12 / .p8 / passwords — configure Actions secrets only.
    - name: Optional Apple code sign and notarize
      id: apple_sign
      env:
        APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        chmod +x packaging/macos/import-identity.sh packaging/macos/sign-and-notarize.sh
        ./packaging/macos/sign-and-notarize.sh --self-check
        OUT_APP="dist/Telegram-Multi-Account-Sender.app"
        if [ -z "${APPLE_CERTIFICATE_BASE64}" ]; then
          echo "Apple Developer secrets not configured; publishing unsigned .app/DMG."
          echo "signed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # shellcheck disable=SC1091
        source ./packaging/macos/import-identity.sh
        ./packaging/macos/sign-and-notarize.sh "${OUT_APP}"
        echo "signed=true" >> "$GITHUB_OUTPUT"
    
    - name: Create .dmg
      run: |
        hdiutil create \
          -srcfolder dist/Telegram-Multi-Account-Sender.app \
          -volname "Telegram Multi-Account Message Sender" \
          -fs HFS+ \
          -format UDZO \
          "telegram-multi-account-sender-${{ steps.set_version_macos.outputs.version }}-macOS.dmg"
        test -f "telegram-multi-account-sender-${{ steps.set_version_macos.outputs.version }}-macOS.dmg"

    - name: Optional notarize DMG
      if: steps.apple_sign.outputs.signed == 'true'
      env:
        APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        DMG="telegram-multi-account-sender-${{ steps.set_version_macos.outputs.version }}-macOS.dmg"
        # Identity may already be in the runner keychain from the previous step
        if [ -z "${APPLE_SIGNING_IDENTITY}" ]; then
          APPLE_SIGNING_IDENTITY="$(security find-identity -v -p codesigning 2>/dev/null | sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' | head -n1 || true)"
          export APPLE_SIGNING_IDENTITY
        fi
        ./packaging/macos/sign-and-notarize.sh "${DMG}" --dmg-only
    
    - name: Upload macOS artifacts
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: macos-build
        path: |
          telegram-multi-account-sender-*-macOS.dmg
        retention-days: 30
        if-no-files-found: warn

  build-pypi:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: |
        python -m build
    
    - name: Check package
      run: |
        twine check dist/*
    
    - name: Upload PyPI package
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/* || echo "PyPI upload skipped (no token or already exists)"

  build-native-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Build tmms_native
      run: |
        ./native/build.sh
        cp bin/tmms_native tmms_native-linux-x86_64
        ./tmms_native-linux-x86_64 <<'EOF'
        {"op":"ping"}
        EOF

    - name: Upload native accelerator artifact
      uses: actions/upload-artifact@v4
      with:
        name: tmms-native-linux
        path: tmms_native-linux-x86_64
        retention-days: 30
        if-no-files-found: error

  create-release:
    needs: [build-windows, build-linux, build-macos, build-pypi, build-native-linux]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set release version
      id: set_version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^v ]]; then
            VERSION="v$VERSION"
          fi
        else
          VERSION="${{ github.ref_name }}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Validate release asset sizes
      shell: bash
      run: |
        set -euo pipefail

        WIN_ASSET="$(find windows-build -type f -name '*.exe' | head -n1 || true)"
        LINUX_ASSET="$(find linux-build -type f -name '*-linux.tar.gz' | head -n1 || true)"
        MAC_ASSET="$(find macos-build -type f -name '*-macOS.dmg' | head -n1 || true)"

        if [ -z "$WIN_ASSET" ] || [ -z "$LINUX_ASSET" ] || [ -z "$MAC_ASSET" ]; then
          echo "Missing one or more release assets (.exe/.tar.gz/.dmg)."
          echo "WIN_ASSET=$WIN_ASSET"
          echo "LINUX_ASSET=$LINUX_ASSET"
          echo "MAC_ASSET=$MAC_ASSET"
          exit 1
        fi

        WIN_SIZE="$(stat -c%s "$WIN_ASSET")"
        LINUX_SIZE="$(stat -c%s "$LINUX_ASSET")"
        MAC_SIZE="$(stat -c%s "$MAC_ASSET")"

        # Guardrails tuned to current build footprint and expected PyInstaller packaging.
        WIN_MIN=$((50 * 1024 * 1024))
        WIN_MAX=$((250 * 1024 * 1024))
        LINUX_MIN=$((70 * 1024 * 1024))
        LINUX_MAX=$((250 * 1024 * 1024))
        MAC_MIN=$((50 * 1024 * 1024))
        MAC_MAX=$((200 * 1024 * 1024))

        check_size() {
          local name="$1"
          local size="$2"
          local min="$3"
          local max="$4"
          if [ "$size" -lt "$min" ] || [ "$size" -gt "$max" ]; then
            echo "$name size check failed: $size bytes (expected $min..$max)"
            exit 1
          fi
          echo "$name size OK: $size bytes"
        }

        check_size "Windows EXE" "$WIN_SIZE" "$WIN_MIN" "$WIN_MAX"
        check_size "Linux TAR.GZ" "$LINUX_SIZE" "$LINUX_MIN" "$LINUX_MAX"
        check_size "macOS DMG" "$MAC_SIZE" "$MAC_MIN" "$MAC_MAX"
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.set_version.outputs.version }}
        name: Release ${{ steps.set_version.outputs.version }}
        body: |
          ## 🎉 Release ${{ steps.set_version.outputs.version }}
          
          ### 📦 Downloads
          
          **Windows:**
          - `telegram-multi-account-sender-${{ steps.set_version.outputs.version }}-windows.exe` - Standalone executable
          - `telegram-multi-account-sender-${{ steps.set_version.outputs.version }}-windows.zip` - EXE + `install.ps1` (per-user `*.tmas-backup.zip` file association)
          
          **Linux:**
          - `telegram-multi-account-sender-${{ steps.set_version.outputs.version }}-linux.tar.gz` - Binary + `install.sh` (desktop entry, icons, `*.tmas-backup.zip` MIME)
          
          **macOS:**
          - `telegram-multi-account-sender-${{ steps.set_version.outputs.version }}-macOS.dmg` - `.app` with backup document types (built on macOS runners; Developer ID sign + notarization run when Apple secrets are configured, otherwise unsigned)

          **Optional native accelerator (Linux x86_64):**
          - `tmms_native-linux-x86_64` — place as `bin/tmms_native` (see docs/installation.md)
          
          ### 🚀 Installation
          
          **From PyPI:**
          ```bash
          pip install telegram-multi-account-sender
          ```
          
          **From Source:**
          ```bash
          git clone https://github.com/VoxHash/Telegram-Multi-Account-Message-Sender.git
          cd Telegram-Multi-Account-Message-Sender
          pip install -r requirements.txt
          python main.py
          ```
          
          ### 📋 What's New
          
          See [CHANGELOG.md](CHANGELOG.md) for detailed changes.
          
          ### 🆘 Support
          
          - [Documentation](https://github.com/VoxHash/Telegram-Multi-Account-Message-Sender/wiki)
          - [Issues](https://github.com/VoxHash/Telegram-Multi-Account-Message-Sender/issues)
          - [Discussions](https://github.com/VoxHash/Telegram-Multi-Account-Message-Sender/discussions)
        files: |
          windows-build/*
          linux-build/*
          macos-build/*
          tmms-native-linux/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
