name: Publish Container Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. 1.2.12 or latest)'
        required: true
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          description: Professional-grade desktop application for managing and sending messages across multiple Telegram accounts
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != 'latest' }}
            type=raw,value=1.2,enable=${{ github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, '1.2.') }}
            type=raw,value=1,enable=${{ github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, '1.') }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ensure container package is public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          OWNER='${{ github.repository_owner }}'
          visibility="$(gh api "/users/${OWNER}/packages/container/${PACKAGE_NAME}" --jq '.visibility')"
          echo "Package visibility: ${visibility}"
          if [ "${visibility}" = "public" ]; then
            echo "Already public."
            exit 0
          fi
          # User-owned packages: PATCH /users/... ; org-owned: PATCH /orgs/...
          # (PUT .../visibility is not a valid Packages REST endpoint.)
          if gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/users/${OWNER}/packages/container/${PACKAGE_NAME}" \
            -f visibility=public; then
            echo "Set to public."
            exit 0
          fi
          if gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${OWNER}/packages/container/${PACKAGE_NAME}" \
            -f visibility=public; then
            echo "Set to public."
            exit 0
          fi
          echo "::error::Package visibility is '${visibility}' and could not be changed via API"
          exit 1

      - name: Publish job summary
        run: |
          echo "### Container image published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull example:" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ghcr.io/${{ github.repository }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
