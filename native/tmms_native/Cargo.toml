[package]
name = "tmms_native"
version = "0.1.0"
edition = "2021"
description = "Native accelerator for Telegram Multi-Account Message Sender (spintax + pacing)"
license = "EPL-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
rand = "0.8"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
